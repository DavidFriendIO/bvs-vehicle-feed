name = "bvs-vehicle-feed"
main = "src/index.js"
compatibility_date = "2026-09-01"

# No "id": Wrangler 4 creates the KV namespace automatically on first deploy and
# keeps using it. To use an existing namespace instead, add: id = "<namespace id>"
[[kv_namespaces]]
binding = "BVS_FEED"

# Crawling runs in GitHub Actions (.github/workflows/crawl.yml); the site blocks Worker requests.
[triggers]
crons = []

[observability]
enabled = true
